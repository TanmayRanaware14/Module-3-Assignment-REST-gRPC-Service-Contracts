syntax = "proto3";

package inventory.v1;

// Inventory check used by the Order service.
service InventoryService {
  rpc CheckInventory (CheckInventoryRequest) returns (CheckInventoryResponse);
}

message CheckInventoryRequest {
  string item_id = 1;
  int32 quantity = 2;
  // Temporary server-side delay, in seconds, used to exceed the client deadline.
  double delay_seconds = 3;
}

message CheckInventoryResponse {
  string item_id = 1;
  bool available = 2;
  int32 available_quantity = 3;
}
